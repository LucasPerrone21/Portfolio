<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000F2E" />
      <stop offset="50%" stop-color="#001A72" />
      <stop offset="100%" stop-color="#000A20" />
    </linearGradient>
    <linearGradient id="redStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E30613" stop-opacity="0" />
      <stop offset="50%" stop-color="#E30613" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="yellowStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0" />
      <stop offset="60%" stop-color="#FFCC00" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="900" cy="240" r="280" fill="#E30613" fill-opacity="0.14" />
  <circle cx="300" cy="560" r="260" fill="#FFCC00" fill-opacity="0.1" />

  <!-- Data Stream Curves -->
  <path d="M-50 580 C 260 560, 420 260, 740 240 C 960 225, 1080 140, 1250 110" stroke="url(#redStream)" stroke-width="4" />
  <path d="M-50 640 C 300 610, 480 340, 810 310 C 1010 290, 1110 210, 1250 180" stroke="url(#yellowStream)" stroke-width="2.5" stroke-dasharray="10 6" />
  <path d="M-50 490 C 210 470, 390 200, 690 190 C 920 180, 1060 95, 1250 70" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Telemetry Panels -->
  <g transform="translate(90, 110)">
    <rect width="460" height="270" fill="#000F2E" fill-opacity="0.85" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <rect width="460" height="4" fill="#E30613" />
    <text x="24" y="36" fill="#FFCC00" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">SISU_HARVESTER // WORKER POOL</text>
    <line x1="24" y1="52" x2="436" y2="52" stroke="rgba(255,255,255,0.1)" />

    <text x="24" y="85" fill="#94A3B8" font-family="monospace" font-size="12">THROUGHPUT</text>
    <text x="24" y="118" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="900">50,420 req/h</text>

    <text x="260" y="85" fill="#94A3B8" font-family="monospace" font-size="12">PROXY ROTATION</text>
    <text x="260" y="118" fill="#FFCC00" font-family="sans-serif" font-size="34" font-weight="900">0% BAN</text>

    <!-- Bars -->
    <g transform="translate(24, 150)">
      <rect x="0" y="45" width="22" height="55" fill="#001A72" stroke="#3B82F6" />
      <rect x="32" y="30" width="22" height="70" fill="#001A72" stroke="#3B82F6" />
      <rect x="64" y="18" width="22" height="82" fill="#E30613" />
      <rect x="96" y="35" width="22" height="65" fill="#001A72" stroke="#3B82F6" />
      <rect x="128" y="10" width="22" height="90" fill="#FFCC00" />
      <rect x="160" y="22" width="22" height="78" fill="#E30613" />
      <rect x="192" y="5" width="22" height="95" fill="#FFCC00" />
      <rect x="224" y="16" width="22" height="84" fill="#E30613" />
      <rect x="256" y="28" width="22" height="72" fill="#001A72" stroke="#3B82F6" />
      <rect x="288" y="12" width="22" height="88" fill="#E30613" />
      <rect x="320" y="0" width="22" height="100" fill="#FFCC00" />
      <rect x="352" y="8" width="22" height="92" fill="#E30613" />
      <rect x="384" y="2" width="22" height="98" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Node Cluster Matrix -->
  <g transform="translate(620, 320)">
    <rect width="490" height="310" fill="#000F2E" fill-opacity="0.88" stroke="rgba(255,204,0,0.35)" stroke-width="1.5" />
    <rect width="490" height="4" fill="#FFCC00" />
    <text x="24" y="36" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">ETL PIPELINE // PANDAS -&gt; POSTGRESQL</text>
    <line x1="24" y1="52" x2="466" y2="52" stroke="rgba(255,255,255,0.1)" />

    <g font-family="monospace" font-size="13">
      <rect x="24" y="72" width="442" height="42" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="44" cy="93" r="5" fill="#10B981" />
      <text x="62" y="98" fill="#FFFFFF">[NODE_01] UFBA_CUTOFF_SYNC</text>
      <text x="360" y="98" fill="#FFCC00" font-weight="bold">14ms · OK</text>

      <rect x="24" y="126" width="442" height="42" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="44" cy="147" r="5" fill="#10B981" />
      <text x="62" y="152" fill="#FFFFFF">[NODE_02] USP_UNICAMP_STREAM</text>
      <text x="360" y="152" fill="#FFCC00" font-weight="bold">19ms · OK</text>

      <rect x="24" y="180" width="442" height="42" fill="rgba(227,6,19,0.12)" stroke="rgba(227,6,19,0.45)" />
      <circle cx="44" cy="201" r="5" fill="#E30613" />
      <text x="62" y="206" fill="#FFFFFF">[NODE_03] PANDAS_NORMALIZER</text>
      <text x="360" y="206" fill="#E30613" font-weight="bold">ACTIVE</text>

      <rect x="24" y="234" width="442" height="42" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="44" cy="255" r="5" fill="#FFCC00" />
      <text x="62" y="260" fill="#FFFFFF">[NODE_04] PG_BULK_UPSERT</text>
      <text x="360" y="260" fill="#10B981" font-weight="bold">COMMITTED</text>
    </g>
  </g>
</svg>

